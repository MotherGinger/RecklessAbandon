name: Release

# Bumps the version, tags it, and publishes the GitHub release.
# Wago and CurseForge are published separately with their own workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 3.2.0 or 3.2.0-beta.1
        required: true
        type: string
      dry_run:
        description: Dry run (build and show everything, push nothing)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main for real releases
        if: ${{ !inputs.dry_run && github.ref_name != 'main' }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Releases must run on main, not '$REF'."
          exit 1

      - name: Check deploy key
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [[ -z $RELEASE_DEPLOY_KEY ]]; then
            echo "::error::The RELEASE_DEPLOY_KEY repository secret is not set."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release script and notes look back through tags
          # main requires pull requests; the deploy key is on the ruleset's bypass list so the
          # bump commit can be pushed directly. Dry runs don't push, so they fall back to the token.
          ssh-key: ${{ !inputs.dry_run && secrets.RELEASE_DEPLOY_KEY || '' }}

      - name: Bump version, commit, and tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./.github/scripts/release.ps1 $env:VERSION
          "TAG=$(git describe --tags --exact-match HEAD)" >> $env:GITHUB_ENV

      - name: Show the release commit
        run: git show --format='%s' HEAD

      - name: Build release notes from CHANGELOG.txt
        run: |
          bash .github/scripts/release-notes.sh "$TAG" > .release-notes.md
          cat .release-notes.md

      - name: Build the zip
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "{package-name}_{project-version}"

      - name: Keep the dry run output
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          include-hidden-files: true
          path: |
            .release/*.zip
            .release-notes.md

      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        # Atomic: if main moved since checkout, nothing is pushed
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ ${TAG,,} == *alpha* || ${TAG,,} == *beta* ]] && flags+=(--prerelease)
          gh release create "$TAG" .release/*.zip --verify-tag --title "$TAG" --notes-file .release-notes.md "${flags[@]}"
